schema_version: "1.1"
name: plan-mode-reads-without-ctx
description: >
  Nearest expressible form of "plan mode makes no ctx_* calls". A case can't start a run in plan mode and
  context-mode isn't one of the plugin's MCP servers, so ctx_* tools never exist in a run and no-ctx passes
  trivially. The case approximates plan mode in the system prompt and checks the Tuner's fallback: research
  goes through Read/Grep/Glob or msnc:explorer, and nothing is edited.
tags: [routing, plan]
context:
  scaffold_script: fixture.sh
